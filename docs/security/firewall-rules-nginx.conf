# n8n Firewall Rules - Nginx Configuration
# Generated for production deployment security
# 
# IMPORTANT: Review and customize before deployment
# This configuration assumes n8n runs on an upstream called 'n8n_backend'

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=n8n_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=n8n_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=n8n_webhook:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=n8n_password:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=n8n_telemetry:10m rate=10r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=n8n_conn:10m;

# Upstream configuration
upstream n8n_backend {
    server 127.0.0.1:5678;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name n8n.example.com;

    # SSL configuration (customize paths)
    ssl_certificate /etc/ssl/certs/n8n.crt;
    ssl_certificate_key /etc/ssl/private/n8n.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Connection limits
    limit_conn n8n_conn 50;

    # Hide server version
    server_tokens off;

    # Request size limits
    client_max_body_size 16M;

    # ============================================
    # CRITICAL: BLOCK DANGEROUS ENDPOINTS
    # ============================================

    # Block E2E testing endpoints (MUST BLOCK in production)
    location ~ ^/rest/e2e {
        return 403 '{"error": "Endpoint disabled in production"}';
    }

    # Block debug endpoints (MUST BLOCK in production)
    location ~ ^/rest/debug {
        return 403 '{"error": "Endpoint disabled in production"}';
    }

    # Block test webhook endpoints
    location ~ ^/webhook-test {
        return 403 '{"error": "Test webhooks disabled in production"}';
    }

    location ~ ^/form-test {
        return 403 '{"error": "Test forms disabled in production"}';
    }

    location ~ ^/mcp-test {
        return 403 '{"error": "Test MCP disabled in production"}';
    }

    # ============================================
    # IP-RESTRICTED ENDPOINTS
    # ============================================

    # Metrics endpoint - restrict to monitoring systems
    location /metrics {
        allow 10.0.0.0/8;       # Internal network
        allow 172.16.0.0/12;    # Internal network
        allow 192.168.0.0/16;   # Internal network
        # Add your monitoring system IPs here
        # allow X.X.X.X;
        deny all;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Owner setup - restrict after initial setup
    # Uncomment to block entirely after setup:
    # location ~ ^/rest/owner/setup {
    #     return 403 '{"error": "Setup already completed"}';
    # }

    # Orchestration endpoints - internal only
    location ~ ^/rest/orchestration {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # RATE-LIMITED AUTHENTICATION ENDPOINTS
    # ============================================

    # Login endpoint - strict rate limiting
    location = /rest/login {
        limit_req zone=n8n_login burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Password reset and change endpoints
    location ~ ^/rest/(password-reset|me/password) {
        limit_req zone=n8n_password burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSO endpoints
    location ~ ^/rest/sso {
        limit_req zone=n8n_login burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Invitation endpoints
    location ~ ^/rest/invitations {
        limit_req zone=n8n_login burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # WEBHOOK ENDPOINTS (External Access)
    # ============================================

    # Production webhooks - rate limited
    location ~ ^/webhook/ {
        limit_req zone=n8n_webhook burst=100 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for webhooks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        
        # Allow larger payloads for webhooks
        client_max_body_size 200M;
    }

    # Waiting webhooks
    location ~ ^/webhook-waiting/ {
        limit_req zone=n8n_webhook burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 300s;
    }

    # Form endpoints
    location ~ ^/form/ {
        limit_req zone=n8n_webhook burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        client_max_body_size 200M;
    }

    # MCP endpoints
    location ~ ^/mcp/ {
        limit_req zone=n8n_api burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # TELEMETRY ENDPOINTS
    # ============================================

    location ~ ^/rest/(posthog|telemetry) {
        limit_req zone=n8n_telemetry burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # PUBLIC API ENDPOINTS
    # ============================================

    location /api/ {
        limit_req zone=n8n_api burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # REST API ENDPOINTS
    # ============================================

    location /rest/ {
        limit_req zone=n8n_api burst=50 nodelay;
        limit_req_status 429;
        
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # HEALTH ENDPOINTS
    # ============================================

    location /healthz {
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # No rate limiting for health checks
        access_log off;
    }

    # ============================================
    # STATIC ASSETS & UI
    # ============================================

    location / {
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # WebSocket support for push
        proxy_read_timeout 86400;
    }

    # ============================================
    # ERROR PAGES
    # ============================================

    error_page 429 = @rate_limit_error;
    location @rate_limit_error {
        default_type application/json;
        return 429 '{"error": "Rate limit exceeded. Please try again later."}';
    }

    error_page 403 = @forbidden_error;
    location @forbidden_error {
        default_type application/json;
        return 403 '{"error": "Access denied"}';
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name n8n.example.com;
    return 301 https://$server_name$request_uri;
}
